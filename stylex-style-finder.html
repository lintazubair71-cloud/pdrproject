<title>StyleX Style Finder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  ============================================================================
  StyleX Style Finder (Lite)  —  for stylexmagazine.com
  ----------------------------------------------------------------------------
  WHAT IT DOES
  Put this ONE code block at the top of ANY article. It scans the article,
  finds the hairstyles in it, and lets the reader pick a face shape to show
  only the matching styles. Same code in every article — nothing to edit.

  HOW IT KNOWS WHICH STYLE SUITS WHICH FACE  (two ways, both built in):
  1) AUTO (no setup): in each hairstyle section, write a short line like
       Best for: Oval, Round, Square
     (also works: "Suits round faces", "Ideal for oval and heart shapes").
     The tool reads the face shapes from that line automatically.
  2) PRECISE (optional): add a tiny tag to the hairstyle's heading:
       <h2 data-face="oval,round,square">Classic Taper Fade</h2>
     If a tag is present it wins over the auto text.

  SETUP IN WORDPRESS
  - Add a "Custom HTML" block at the TOP of the post.
  - Paste everything between <!== COPY FROM HERE ==> and <!== COPY TO HERE ==>.
  - Make sure each hairstyle is a heading (default <h2>). Change SXM.heading
    below if your styles use <h3>.
  Fully self-contained: no external files, no libraries, no clash with theme.
  ============================================================================
-->

<!== COPY FROM HERE ==>
<style>
/* StyleX Style Finder — slim filter bar. Scoped under .sxmf. Ink + brass. */
.sxmf{
  --sxmf-bg:#faf8f4; --sxmf-ink:#1a1816; --sxmf-muted:#6b655d;
  --sxmf-line:#e4ded4; --sxmf-accent:#b07d2b; --sxmf-on-accent:#fff;
  --sxmf-head:"Space Grotesk",system-ui,Segoe UI,Roboto,sans-serif;
  --sxmf-body:"Inter",system-ui,Segoe UI,Roboto,sans-serif;
  box-sizing:border-box;font-family:var(--sxmf-body);color:var(--sxmf-ink);
  background:var(--sxmf-bg);border:1px solid var(--sxmf-line);
  border-left:4px solid var(--sxmf-accent);border-radius:12px;
  padding:14px clamp(14px,3vw,18px);max-width:860px;margin:22px auto;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-color-scheme:dark){.sxmf:not([data-sxmf-theme="light"]){
  --sxmf-bg:#1b1812;--sxmf-ink:#f3efe7;--sxmf-muted:#a79e8f;--sxmf-line:#39332a;
  --sxmf-accent:#d9a94e;--sxmf-on-accent:#1a1510;color-scheme:dark;}}
.sxmf[data-sxmf-theme="dark"]{
  --sxmf-bg:#1b1812;--sxmf-ink:#f3efe7;--sxmf-muted:#a79e8f;--sxmf-line:#39332a;
  --sxmf-accent:#d9a94e;--sxmf-on-accent:#1a1510;color-scheme:dark;}
.sxmf *,.sxmf *::before,.sxmf *::after{box-sizing:border-box}
.sxmf .sxmf-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sxmf .sxmf-ic{width:17px;height:17px;flex:0 0 auto;color:var(--sxmf-accent)}
.sxmf .sxmf-title{font-family:var(--sxmf-head);font-size:1rem;font-weight:700;margin:0;line-height:1.2}
.sxmf .sxmf-title span{color:var(--sxmf-muted);font-weight:400;font-size:.85rem}
.sxmf .sxmf-rows{display:flex;flex-direction:column;gap:9px}
.sxmf .sxmf-row{display:flex;flex-wrap:wrap;align-items:center;gap:7px}
.sxmf .sxmf-lab{font-family:var(--sxmf-head);font-size:.72rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--sxmf-muted);min-width:82px;flex:0 0 auto}
.sxmf .sxmf-chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.sxmf .sxmf-chip{font:inherit;font-size:.84rem;cursor:pointer;border:1px solid var(--sxmf-line);background:transparent;color:var(--sxmf-ink);padding:5px 12px;border-radius:999px;transition:background .15s,border-color .15s,color .15s}
.sxmf .sxmf-chip:hover{border-color:var(--sxmf-accent)}
.sxmf .sxmf-chip .sxmf-n{color:var(--sxmf-muted);font-size:.78em;margin-left:4px}
.sxmf .sxmf-chip[aria-pressed="true"]{background:var(--sxmf-accent);border-color:var(--sxmf-accent);color:var(--sxmf-on-accent);font-weight:600}
.sxmf .sxmf-chip[aria-pressed="true"] .sxmf-n{color:var(--sxmf-on-accent);opacity:.8}
.sxmf .sxmf-chip:focus-visible{outline:2px solid var(--sxmf-accent);outline-offset:2px}
.sxmf .sxmf-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:11px;padding-top:10px;border-top:1px solid var(--sxmf-line)}
.sxmf .sxmf-count{font-size:.85rem;color:var(--sxmf-muted)}
.sxmf .sxmf-count b{color:var(--sxmf-ink)}
.sxmf .sxmf-reset{font:inherit;font-size:.82rem;cursor:pointer;border:none;background:none;color:var(--sxmf-accent);font-weight:600;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}
.sxmf .sxmf-reset:focus-visible{outline:2px solid var(--sxmf-accent);outline-offset:2px}
.sxmf[hidden]{display:none}
/* Highlight pulse on a style when it becomes the focus (optional nicety) */
.sxmf-hiddenstyle{display:none!important}
@media (max-width:520px){.sxmf .sxmf-lab{min-width:100%}}
@media (prefers-reduced-motion:reduce){.sxmf *{transition:none!important}}

/* ---- Info box shown under each hairstyle (in your brand colours) ----
   Change #ff2c54 below if you want a different accent. */
.sxm-meta{
  background:#fdeef1;                 /* light tint of your brand accent */
  border:1px solid #f7d9e0;
  border-left:4px solid #ff2c54;      /* your brand accent */
  border-radius:10px;
  padding:11px 15px;margin:12px 0 22px;
  font-size:.95rem;line-height:1.8;color:#2b2d42;
  font-family:"Poppins","Inter",system-ui,sans-serif;
}
.sxm-meta strong{color:#1f2030;font-weight:600}
@media (prefers-color-scheme:dark){
  .sxm-meta{background:#2a1a1f;border-color:#4a2a33;color:#ead9de}
  .sxm-meta strong{color:#fff}
}
</style>

<section class="sxmf" id="sxmf" aria-label="Find your style by face shape" hidden>
  <div class="sxmf-top">
    <svg class="sxmf-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <h2 class="sxmf-title">Find your style <span>— pick your face shape</span></h2>
  </div>
  <div class="sxmf-rows" id="sxmfRows"></div>
  <div class="sxmf-foot">
    <span class="sxmf-count" id="sxmfCount"></span>
    <button type="button" class="sxmf-reset" id="sxmfReset">Show all</button>
  </div>
</section>

<script>
(function(){
  "use strict";

  /* ---- Small config (you rarely need to touch this) ---- */
  var SXM = {
    scope: ".entry-content, article .post-content, article, main, body", // where the article lives
    heading: "auto",   // "auto" = detect headings (H2-H5) OR numbered bold paragraphs. Or force e.g. "h3".
    autoText: true     // also read face shapes from a "Best for: ..." line in each section
  };

  /* ---- Known face shapes (order + labels) ---- */
  var FACE_ORDER = ["oval","round","square","oblong","heart","diamond","triangle"];
  var FACE_LABEL = {oval:"Oval",round:"Round",square:"Square",oblong:"Oblong",heart:"Heart",diamond:"Diamond",triangle:"Triangle"};
  // words in article text that map to a face shape
  var FACE_WORDS = {
    oval:["oval"], round:["round"], square:["square"],
    oblong:["oblong","rectangle","rectangular","long face"],
    heart:["heart"], diamond:["diamond"], triangle:["triangle","triangular","pear"]
  };
  var ALL_PHRASES = ["all face shapes","any face shape","every face shape","all shapes","most face shapes","any shape"];

  function ready(fn){ if(document.readyState!=="loading") fn(); else document.addEventListener("DOMContentLoaded",fn); }

  ready(function(){
    var bar = document.getElementById("sxmf");
    if(!bar) return;

    var container=null;
    SXM.scope.split(",").some(function(sel){ var el=document.querySelector(sel.trim()); if(el){container=el;return true;} return false; });
    if(!container) container=document.body;

    /* Find which heading level the hairstyles use, and build a record per style.
       "auto" tries H2/H3/H4 and keeps whichever level yields the most styles. */
    /* Detect the styles in the article. Works with EITHER:
       (a) headings (H2/H3/H4), or
       (b) numbered bold paragraphs like "1. Low Taper Fade." — no heading needed.
       A block only counts as a style if it has a face-shape cue line ("Best for: ..."). */
    function buildStyles(isAnchor){
      var anchors=[];
      Array.prototype.forEach.call(container.querySelectorAll("h2,h3,h4,h5,p,li"), function(el){ if(isAnchor(el)) anchors.push(el); });
      var set = (window.Set ? new Set(anchors) : {has:function(x){return anchors.indexOf(x)>=0;}});
      var out=[];
      anchors.forEach(function(a){
        var nodes=[a], n=a.nextElementSibling;
        while(n && !set.has(n)){ nodes.push(n); n=n.nextElementSibling; } // block = anchor + siblings up to next anchor
        var faces=readFaces(a, nodes);
        if(faces && faces.size) out.push({heading:a, nodes:nodes, faces:faces});
      });
      return out;
    }
    var styles;
    if(SXM.heading && SXM.heading !== "auto"){
      styles = buildStyles(function(el){ return el.tagName === SXM.heading.toUpperCase(); });
    } else {
      var byHeading = buildStyles(function(el){ return /^H[2-5]$/.test(el.tagName); });
      var byNumber  = buildStyles(function(el){ return (el.tagName==="P"||el.tagName==="LI") && /^\s*\d+\s*[.)]/.test((el.textContent||"").trim()); });
      styles = (byNumber.length > byHeading.length) ? byNumber : byHeading; // whichever finds more styles
    }

    if(styles.length < 2){ return; } // nothing to filter — keep bar hidden

    /* Which face shapes actually appear, in display order */
    var present={};
    styles.forEach(function(s){ s.faces.forEach(function(f){ present[f]=true; }); });
    var faceList=FACE_ORDER.filter(function(f){ return present[f]; });
    if(faceList.length < 2){ return; }

    /* Build the chip row */
    var rows=document.getElementById("sxmfRows");
    var row=document.createElement("div"); row.className="sxmf-row";
    var lab=document.createElement("span"); lab.className="sxmf-lab"; lab.textContent="Face shape"; row.appendChild(lab);
    var chipsWrap=document.createElement("div"); chipsWrap.className="sxmf-chips";
    var selected=null;

    faceList.forEach(function(f){
      var count=styles.filter(function(s){return s.faces.has(f);}).length;
      var b=document.createElement("button");
      b.type="button"; b.className="sxmf-chip"; b.setAttribute("aria-pressed","false"); b.dataset.face=f;
      b.innerHTML=FACE_LABEL[f]+' <span class="sxmf-n">'+count+'</span>';
      b.addEventListener("click",function(){
        selected = (selected===f) ? null : f;
        apply();
      });
      chipsWrap.appendChild(b);
    });
    row.appendChild(chipsWrap); rows.appendChild(row);

    var countEl=document.getElementById("sxmfCount");
    document.getElementById("sxmfReset").addEventListener("click",function(){ selected=null; apply(); });

    function apply(){
      chipsWrap.querySelectorAll(".sxmf-chip").forEach(function(b){
        b.setAttribute("aria-pressed", b.dataset.face===selected ? "true":"false");
      });
      var shown=0;
      styles.forEach(function(s){
        var match = !selected || s.faces.has(selected);
        if(match) shown++;
        s.nodes.forEach(function(nd){ nd.classList.toggle("sxmf-hiddenstyle", !match); });
      });
      if(!selected){ countEl.innerHTML="Showing all <b>"+styles.length+"</b> styles"; }
      else { countEl.innerHTML="Showing <b>"+shown+"</b> of "+styles.length+" for "+FACE_LABEL[selected]+" faces"; }
    }

    apply();
    bar.hidden=false; // reveal only once we know it works

    /* ---------- helpers ---------- */
    function readFaces(h, nodes){
      // 1) explicit tag on the heading wins
      var tag = h.getAttribute("data-face");
      if(tag){ return toSet(tag.split(/[,\s]+/)); }
      if(!SXM.autoText) return null;

      // 2) read ONLY from a face-shape cue line ("Best for: ...", "Suits ...", etc.)
      var low = nodes.map(function(n){return n.textContent||"";}).join("  ").toLowerCase();
      var cue = low.search(/\b(best for|best suited|suits|suited to|suited for|ideal for|perfect for|great for|good for|works for|works best for|recommended for|flatters|face shapes?)\b/);
      if(cue < 0) return null;                 // no cue line = not treated as a style (avoids false matches)
      var scan = low.slice(cue, cue+160);

      // "all face shapes"
      for(var i=0;i<ALL_PHRASES.length;i++){ if(scan.indexOf(ALL_PHRASES[i])>=0){ return toSet(FACE_ORDER.slice()); } }

      var found=new Set();
      Object.keys(FACE_WORDS).forEach(function(f){
        FACE_WORDS[f].forEach(function(w){
          var re=new RegExp("\\b"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b");
          if(re.test(scan)) found.add(f);
        });
      });
      return found.size ? found : null;
    }
    function toSet(arr){
      var s=new Set();
      arr.forEach(function(v){ v=(v||"").trim().toLowerCase(); if(FACE_LABEL[v]) s.add(v); });
      return s;
    }
  });
})();
</script>
